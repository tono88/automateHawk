services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: hub_admin
      POSTGRES_DB: automatehawk
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_admin_password
    secrets:
      - postgres_admin_password
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hub_admin -d automatehawk"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  hub:
    build: .
    ports:
      - "127.0.0.1:8765:8080"
    environment:
      HUB_MODE: local
      HUB_AUTH_MODE: screen
      HUB_READ_LANES: ${HUB_READ_LANES:-2}
      HUB_WORKER_URL: http://oracle-worker:8767
      HUB_WORKER_SECRET_FILE: /run/secrets/worker_secret
      HUB_DATABASE_DSN_FILE: /run/secrets/hub_database_dsn
      HUB_LOCAL_ROLE: ${HUB_LOCAL_ROLE:-reader}
    secrets:
      - hub_database_dsn
      - worker_secret
    depends_on:
      postgres:
        condition: service_healthy
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
  oracle-worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    environment:
      HUB_SCREEN_OPERATIONS: ${HUB_SCREEN_OPERATIONS:-2}
      ORACLE_LOGIN_ORIGIN: https://idcs-7352383b58144b88b6039c9d2de49434.identity.oraclecloud.com
      ORACLE_URL: https://ehvs.fa.us6.oraclecloud.com/hcmUI/faces/FuseWelcome
      HUB_WORKER_SECRET_FILE: /run/secrets/worker_secret
    secrets:
      - worker_secret
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=512m,mode=1777
    shm_size: 256mb
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
volumes:
  postgres_data:
secrets:
  postgres_admin_password:
    file: ${HUB_PG_ADMIN_SECRET_FILE:?Run scripts/provision_local.py first}
  hub_database_dsn:
    file: ${HUB_PG_DOCKER_DSN_FILE:?Run scripts/provision_local.py first}

  worker_secret:
    file: ${HUB_WORKER_SECRET_FILE:?Run scripts/provision_local.py first}
